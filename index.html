<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalTalk AI - 맞춤형 학습 센터</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif; color: #333;
    }
    .app-header {
      background: #2c3e50; color: #ffffff; padding: 15px 20px; text-align: center;
      position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .app-header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .top-bar-user { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 13px; }
    
    .container {
      width: min(900px, 92%); margin: 30px auto;
      background: #ffffff; border-radius: 24px; padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }
    h2 { margin-top: 0; font-size: 22px; text-align: center; color: #2c3e50; }

    /* 인증 섹션 */
    .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    input { height: 46px; padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; }
    input:focus, textarea:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }

    /* 탭 메뉴 */
    .tab-menu { display: flex; background: #f1f3f5; padding: 6px; border-radius: 14px; margin-bottom: 25px; gap: 5px; }
    .tab-btn {
      flex: 1; height: 44px; border: none; background: none; font-size: 15px;
      font-weight: bold; color: #666; border-radius: 10px; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active { background: #ffffff; color: #2c3e50; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

    textarea {
      width: 100%; min-height: 120px; resize: vertical; padding: 16px;
      border: 1px solid #ddd; border-radius: 16px; font-size: 16px; line-height: 1.5; outline: none;
    }

    /* 채팅창 말풍선 스타일 */
    .chat-container {
      border: 1px solid #eee; border-radius: 20px; background: #fdfdfd;
      height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 15px;
    }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; }
    .msg.user { background: #e3f2fd; color: #0d47a1; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ai { background: #f1f3f5; color: #212121; align-self: flex-start; border-bottom-left-radius: 4px; position: relative; }
    
    /* 재생 버튼 스타일 */
    .play-voice-btn {
      background: #7e57c2; color: white; border: none; border-radius: 50%;
      width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; cursor: pointer; margin-left: 8px; vertical-align: middle;
    }

    /* 버튼 스타일 */
    button {
      border: none; border-radius: 12px; padding: 0 20px; height: 46px; font-size: 14px;
      cursor: pointer; transition: 0.15s; font-weight: bold; display: inline-flex; align-items: center; justify-content: center;
    }
    button:hover { transform: translateY(-1px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }

    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: rgba(255, 255, 255, 0.2); color: white; padding: 5px 10px; height: auto; font-size: 11px; margin-left: 8px; border-radius: 4px;}
    .translate-btn { background: #00bfc4; color: white; width: 100%; }
    .send-btn { background: #42a5f5; color: white; }
    .mic-btn { background: #ef5350; color: white; }
    .mic-btn.recording { animation: pulse 1.5s infinite; background: #c62828; }

    .button-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    .label { font-weight: bold; margin-bottom: 8px; font-size: 15px; color: #2c3e50; }
    .status { min-height: 24px; margin-top: 14px; color: #555; font-size: 13px; text-align: center; background: #f8f9fa; padding: 8px; border-radius: 8px; }
    .notice { max-width: 420px; margin: 20px auto 0; padding: 14px; border-radius: 14px; background: #fff8e1; color: #6d4c41; font-size: 13px; text-align: center; }
    .hidden { display: none !important; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🌍 GlobalTalk AI 스마트 학습 센터</h1>
    <div class="top-bar-user hidden" id="topUserBar">
      계정: <strong id="userEmail"></strong>
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="container">

    <section id="authSection">
      <div class="auth-box">
        <h2>스마트 회원 인증</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
      <div class="notice">처음 사용하는 이메일은 <strong>회원가입</strong>을 진행해 주세요.</div>
    </section>

    <section id="mainSection" class="hidden">
      
      <div class="tab-menu">
        <button class="tab-btn active" id="tabTranslateBtn">① 실시간 스마트 번역기</button>
        <button class="tab-btn" id="tabChatBtn">② AI 실시간 영어 회화창</button>
      </div>

      <div id="translateSection">
        <div class="label">번역할 문장 입력 (한국어 또는 영어)</div>
        <textarea id="transInput" placeholder="이곳에 문장을 입력하고 아래 버튼을 누르세요."></textarea>
        <div class="button-row"><button class="translate-btn" id="actionTranslateBtn">🔄 교차 번역하기</button></div>
        <div class="label" style="margin-top: 15px;">번역 결과 해석</div>
        <textarea id="transOutput" readonly placeholder="번역 결과가 이곳에 표시됩니다." style="background: #f8f9fa;"></textarea>
      </div>

      <div id="chatSection" class="hidden">
        <div class="chat-container" id="chatContainer">
          <div class="msg ai">Hello! I am your AI English partner. Let's practice speaking English! Tell me anything. 😊</div>
        </div>

        <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #555;">
          <span>🔊 목소리 고정: nova (여성 원어민)</span>
          <div>
            발음 속도: <input id="speedInput" type="number" min="0.6" max="1.5" step="0.1" value="1.0" style="width: 60px; height: 28px; text-align: center; border: 1px solid #ddd; border-radius: 6px;" />
          </div>
        </div>

        <textarea id="chatInput" placeholder="AI에게 영어로 메시지를 보내보세요. 마이크를 켜고 말하셔도 됩니다. (Ctrl+Enter를 누르면 전송됩니다.)"></textarea>
        
        <div class="button-row">
          <button class="mic-btn" id="micBtn">🎤 음성 녹음 시작</button>
          <button class="send-btn" id="sendBtn">🚀 메시지 전송</button>
        </div>
      </div>

      <audio id="globalAudioPlayer" class="hidden"></audio>

      <div id="status" class="status">시스템이 준비되었습니다.</div>

    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // Firebase 설정 구조 유지
    const firebaseConfig = {
      apiKey: "AIzaSyDD_yegk8yWfnWF-cCstix9_utk4oK6jDM",
      authDomain: "test-60c81.firebaseapp.com",
      databaseURL: "https://test-60c81-default-rtdb.firebaseio.com",
      projectId: "test-60c81",
      storageBucket: "test-60c81.firebasestorage.app",
      messagingSenderId: "509531634634",
      appId: "1:509531634634:web:bc8417e2cee012e7f0ed33",
      measurementId: "G-JWLD6P3V10"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // 지정해주신 최신 Apps Script 배포 URL 주소 바인딩
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyw9yGyYff3ttsAiMgLprGFLs3c--j8rdK3glkuzPSmsQSk2omKxr3NnqYFTpv9JneoyA/exec';

    // DOM 매핑
    const authSection = document.getElementById('authSection'), mainSection = document.getElementById('mainSection');
    const topUserBar = document.getElementById('topUserBar'), userEmail = document.getElementById('userEmail');
    const tabTranslateBtn = document.getElementById('tabTranslateBtn'), tabChatBtn = document.getElementById('tabChatBtn');
    const translateSection = document.getElementById('translateSection'), chatSection = document.getElementById('chatSection');
    
    const emailInput = document.getElementById('emailInput'), passwordInput = document.getElementById('passwordInput');
    const transInput = document.getElementById('transInput'), transOutput = document.getElementById('transOutput');
    const chatContainer = document.getElementById('chatContainer'), chatInput = document.getElementById('chatInput');
    
    const loginBtn = document.getElementById('loginBtn'), signupBtn = document.getElementById('signupBtn'), logoutBtn = document.getElementById('logoutBtn');
    const actionTranslateBtn = document.getElementById('actionTranslateBtn'), sendBtn = document.getElementById('sendBtn'), micBtn = document.getElementById('micBtn');
    const speedInput = document.getElementById('speedInput'), statusBox = document.getElementById('status'), globalAudioPlayer = document.getElementById('globalAudioPlayer');

    let currentUser = null;
    let lastAudioUrl = null; 

    function setStatus(msg) { statusBox.textContent = msg; }

    // 탭 토글 로직
    tabTranslateBtn.addEventListener('click', () => {
      tabTranslateBtn.classList.add('active'); tabChatBtn.classList.remove('active');
      translateSection.classList.remove('hidden'); chatSection.classList.add('hidden');
      setStatus('실시간 번역기 모드입니다.');
    });
    tabChatBtn.addEventListener('click', () => {
      tabChatBtn.classList.add('active'); tabTranslateBtn.classList.remove('active');
      translateSection.classList.add('hidden'); chatSection.classList.remove('hidden');
      chatContainer.scrollTop = chatContainer.scrollHeight;
      setStatus('AI 실시간 영어 회화 모드입니다.');
    });

    // Firebase 인증 로직 
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim(), password = passwordInput.value.trim();
      if(!email || password.length < 6) { alert('이메일과 6자리 이상의 비밀번호를 적어주세요.'); return; }
      try { await createUserWithEmailAndPassword(auth, email, password); alert('가입 성공!'); } catch(e) { alert('가입 실패: ' + e.message); }
    });
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim(), password = passwordInput.value.trim();
      try { await signInWithEmailAndPassword(auth, email, password); } catch(e) { alert('로그인 실패: 이메일과 패스워드를 확인하세요.'); }
    });
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user; authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        topUserBar.classList.remove('hidden'); userEmail.textContent = user.email;
      } else {
        currentUser = null; authSection.classList.remove('hidden'); mainSection.classList.add('hidden');
        topUserBar.classList.add('hidden'); userEmail.textContent = '';
      }
    });

    // ① [화면 A] 스마트 번역기 기능
    actionTranslateBtn.addEventListener('click', async () => {
      const text = transInput.value.trim();
      if (!text) return;
      try {
        actionTranslateBtn.disabled = true; setStatus('번역 처리 중...');
        const hasKorean = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(text);
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${hasKorean?'ko':'en'}&tl=${hasKorean?'en':'ko'}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url); const result = await res.json();
        let translatedText = '';
        if (result && result[0]) result[0].forEach(row => { if(row[0]) translatedText += row[0]; });
        transOutput.value = translatedText; setStatus('번역 완료.');
      } catch(e) { setStatus('번역 실패'); } finally { actionTranslateBtn.disabled = false; }
    });

    // ② [화면 B] AI 원어민 회화 전송 처리 (핵심 변화 부분)
    async function sendChatMessage() {
      const userText = chatInput.value.trim();
      if (!userText) return;

      // 1. 내 말풍선 화면에 즉시 추가
      appendMessage('user', userText);
      chatInput.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        sendBtn.disabled = true; setStatus('AI 파트너가 답변을 생각하고 소리로 변환하는 중입니다...');
        
        // 2. 구글 앱스 스크립트 백엔드로 전송 (타입: chat)
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'chat', text: userText, speed: Number(speedInput.value || 1.0) })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        // 3. AI 답변 말풍선 추가 및 음성 자동 재생
        appendMessage('ai', data.aiText, data.audioBase64);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        setStatus('대화 완료! 목소리를 다시 들으려면 말풍선 옆 재생(▶) 버튼을 누르세요.');

        // 4. Firebase Realtime DB에 대화 내용 누적 기록하기
        if (currentUser) {
          const logRef = ref(database, `users/${currentUser.uid}/items`);
          await set(push(logRef), {
            title: 'Chat Log',
            content: `User: ${userText} / AI: ${data.aiText}`,
            createdAt: new Date().toLocaleString('ko-KR')
          });
        }
      } catch (error) {
        alert('AI 대화 처리 중 에러 발생: ' + error.message);
        setStatus('서버 통신 실패');
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && e.ctrlKey) sendChatMessage(); });

    // 말풍선 동적 추가 함수
    function appendMessage(sender, text, base64Audio = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.textContent = text;

      // AI 대답이고 음성이 함께 내려왔다면 소리 재생기 연결
      if (sender === 'ai' && base64Audio) {
        const audioUrl = base64ToAudioUrl(base64Audio, 'audio/mpeg');
        
        // 말풍선 옆에 개별 재생 버튼 배치
        const playBtn = document.createElement('button');
        playBtn.className = 'play-voice-btn';
        playBtn.textContent = '▶';
        playBtn.onclick = () => {
          globalAudioPlayer.src = audioUrl;
          globalAudioPlayer.play();
        };
        msgDiv.appendChild(playBtn);

        // 첫 등장 시 자동으로 목소리 재생하기
        globalAudioPlayer.src = audioUrl;
        globalAudioPlayer.play().catch(() => {});
      }
      chatContainer.appendChild(msgDiv);
    }

    // 내장 STT 마이크 연동 (회화 전용)
    let recognition; let isRecording = false;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition(); recognition.continuous = false; recognition.lang = 'en-US';
      recognition.onstart = () => { isRecording = true; micBtn.textContent = "🛑 듣고 있어요..."; micBtn.classList.add('recording'); };
      recognition.onend = () => { isRecording = false; micBtn.textContent = "🎤 음성 녹음 시작"; micBtn.classList.remove('recording'); };
      recognition.onresult = (e) => { chatInput.value = e.results[0][0].transcript; };
    }
    micBtn.addEventListener('click', () => {
      if(!recognition) { alert('크롬 브라우저를 써주세요.'); return; }
      if(isRecording) recognition.stop(); else recognition.start();
    });

    // 유틸: base64 디코딩용 함수
    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64); const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }
  </script>
</body>
</html>
